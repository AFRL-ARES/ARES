name: ARES OS Release Pipeline

on:
  release:
    types: [released]

env:
  UI_PROJECT_FILE: 'UI/UI.csproj'
  OUTPUT_PATH: 'publish' 

jobs:
  build-and-deploy-prerelease:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            runtime_id: linux-x64
            os_name_tag: linux
          - os: windows-latest
            runtime_id: win-x64
            os_name_tag: windows
          - os: macos-latest
            runtime_id: osx-x64
            os_name_tag: macos
            
    runs-on: ${{ matrix.os }}
    env:
      ZIP_FILE_NAME: 'ARES-OS-${{ github.event.release.tag_name }}-${{ matrix.os_name_tag }}.zip'

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.release.tag_name }}
      
    - name: Checkout Device Drivers
      uses: actions/checkout@v4
      with:
        repository: 'AFRL-ARES/Ares.Device.Drivers'
        path: 'DriversRepo'

    - name: Set up .NET 10.x
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.x'
        
    - name: Setup Node.js Environment
      uses: actions/setup-node@v4
      with:
        node-version: 24

    - name: Install Node.js Dev Packages
      run: npm ci
      working-directory: UI
      
    - name: Build Device Drivers
      working-directory: DriversRepo
      run: |
        echo "Building Device Drivers..."
        dotnet build Ares.Device.Drivers.slnx --configuration Release

    - name: Restore Dependencies for UI
      run: |
        dotnet restore ${{ env.UI_PROJECT_FILE }}

    - name: Build ARES
      run: |
        echo "Building ARES to make sure the js artifacts are properly created."
        dotnet build ${{ env.UI_PROJECT_FILE }} --configuration Release

    - name: Publish Self-Contained Release Artifacts
      run: |
        echo "Publishing ARES Project for ${{ matrix.os_name_tag }}  (${{ matrix.runtime_id }})"
        dotnet publish ${{ env.UI_PROJECT_FILE }} --configuration Release --output ${{ env.OUTPUT_PATH }} /p:UseAppHost=true -r ${{ matrix.runtime_id }} --self-contained true
        
    - name: Copy Driver Plugins to ARES Output
      shell: bash
      run: |
        echo "Copying plugins to the publish directory..."
        cp -r DriversRepo/plugins ${{ env.OUTPUT_PATH }}/plugins

    - name: Create ZIP Archive (Windows)
      if: runner.os == 'Windows'
      run: 7z a -r "${{ env.ZIP_FILE_NAME }}" .\"${{ env.OUTPUT_PATH }}\*"
      
    - name: Create ZIP Archive (Linux/macOS)
      if: runner.os != 'Windows'
      run: |
        cd ${{ env.OUTPUT_PATH }}
        zip -r ../${{ env.ZIP_FILE_NAME }} .
    
    - name: Upload Published Binaries to Release
      uses: softprops/action-gh-release@v2
      with:
        files: ${{ env.ZIP_FILE_NAME }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}