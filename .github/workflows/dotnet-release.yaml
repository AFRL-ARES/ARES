name: ARES OS Visualization Build Test

on:
  push:
    branches:
      - Visualization # Triggers every time you push to this branch

env:
  UI_PROJECT_FILE: 'UI/UI.csproj'
  OUTPUT_PATH: 'publish' 

jobs:
  build-and-deploy-prerelease:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            runtime_id: linux-x64
            os_name_tag: linux
          - os: windows-latest
            runtime_id: win-x64
            os_name_tag: windows
          - os: macos-latest
            runtime_id: osx-x64
            os_name_tag: macos
            
    runs-on: ${{ matrix.os }}
    env:
      # Swapped the release tag for the run number so the zip always gets a unique name
      ZIP_FILE_NAME: 'ARES-OS-Visualization-Build-${{ github.run_number }}-${{ matrix.os_name_tag }}.zip'

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      # Removed the 'ref' target so it just grabs the latest Visualization commit
      
    # Clone the drivers repo into 'DriversRepo'
    - name: Checkout Device Drivers
      uses: actions/checkout@v4
      with:
        repository: 'AFRL-ARES/Ares.Device.Drivers'
        path: 'DriversRepo'
        
    - name: Verify Drivers Repo Location
      shell: bash
      run: |
        echo "The root workspace is: $GITHUB_WORKSPACE"
        echo "The drivers repo was cloned to: $GITHUB_WORKSPACE/DriversRepo"
        echo "--- Contents of DriversRepo ---"
        ls -la DriversRepo

    - name: Set up .NET 10.x
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.x'
        
    - name: Setup Node.js Environment
      uses: actions/setup-node@v4
      with:
        node-version: 24

    - name: Install Node.js Dev Packages
      run: npm ci
      working-directory: UI
      
    # Build the drivers repo
    - name: Build Device Drivers
      working-directory: DriversRepo
      run: |
        echo "Building Device Drivers..."
        dotnet build Ares.Device.Drivers.slnx --configuration Release

    - name: Restore Dependencies for UI and Service
      run: |
        dotnet restore ${{ env.UI_PROJECT_FILE }}

    - name: Build and Publish Self-Contained Release Artifacts
      run: |
        echo "Publishing ARES Project for ${{ matrix.os_name_tag }}  (${{ matrix.runtime_id }})"
        dotnet publish ${{ env.UI_PROJECT_FILE }} --configuration Release --output ${{ env.OUTPUT_PATH }} /p:UseAppHost=true -r ${{ matrix.runtime_id }} --self-contained true
        
    # Copy the plugins folder to the ARES publish directory
    - name: Copy Driver Plugins to ARES Output
      shell: bash
      run: |
        echo "Copying plugins to the publish directory..."
        cp -r DriversRepo/plugins ${{ env.OUTPUT_PATH }}/plugins

    - name: Create ZIP Archive (Windows)
      if: runner.os == 'Windows'
      run: 7z a -r "${{ env.ZIP_FILE_NAME }}" .\"${{ env.OUTPUT_PATH }}\*"
      
    - name: Create ZIP Archive (Linux/macOS)
      if: runner.os != 'Windows'
      run: |
        cd ${{ env.OUTPUT_PATH }}
        zip -r ../${{ env.ZIP_FILE_NAME }} .
    
    # Uploads the zip file as an artifact instead of publishing a release
    - name: Upload Published Binaries as Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ares-binaries-${{ matrix.os_name_tag }} # Creates a separate download link for each OS
        path: ${{ env.ZIP_FILE_NAME }}
        retention-days: 7 # Keeps your GitHub storage clean by deleting the zip after a week