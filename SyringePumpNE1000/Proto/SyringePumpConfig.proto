syntax = "proto3";

package ares.syringe_pump.ne1000.messaging;

message SyringePumpConfig {
  string name = 1;
  string port_name = 2; // the port name for the syringe pump to connect to
  uint32 address = 3; // the address of the pump
  bool simulated = 4; // indicated whether or not the pump is simulated
}