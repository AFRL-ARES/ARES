syntax = "proto3";

package ValveController.services;

import "google/protobuf/empty.proto";
import "DataModel.proto";
import "ValveControllerConfig.proto";

service ValveControllerRpc {
  rpc EngageRelayOne(DeviceRequest) returns (google.protobuf.Empty);
  rpc EngageRelayTwo(DeviceRequest) returns (google.protobuf.Empty);
  rpc DisengageRelayOne(DeviceRequest) returns (google.protobuf.Empty);
  rpc DisengageRelayTwo(DeviceRequest) returns (google.protobuf.Empty);
  rpc EnableRelays(DeviceRequest) returns (google.protobuf.Empty);
  rpc GetRelayStatus(DeviceRequest) returns (GetRelayStatusResponse);

  rpc AddValveController(config.ValveControllerConfig) returns (google.protobuf.Empty);
  rpc RemoveValveController(ValveControllerRequest) returns (google.protobuf.Empty);
  rpc GetAllValveControllers(google.protobuf.Empty) returns (GetAllValveControllersResponse);
  rpc UpdateValveControllers(UpdateValveControllerRequest) returns (google.protobuf.Empty);
}

message UpdateValveControllerRequest {
  string id = 1;
  config.ValveControllerConfig config = 2;
}

message DeviceRequest {
  string device_id = 1;
}

message ValveControllerRequest {
  string device_id = 1;
}

message GetRelayStatusResponse{
  int64 response = 1;
}

message DataResponse {
    ValveController.data_model.Data data = 1;
}

message GetAllValveControllersResponse {
  repeated DeviceDescription devices = 1;
}

message DeviceDescription {
  string id = 1;
  string name = 2;
}