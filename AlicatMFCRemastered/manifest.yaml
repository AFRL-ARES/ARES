# ARES Device Driver Manifest
# Target: Alicat MFC Remastered

# Basic Metadata
device_type_name: "Alicat Mass Flow Controller"
driver_id: "alicat_mfc_remastered_v1"
connection_type: "Serial"

# The DLL that contains the MassFlowController and ViewModel classes
assembly_name: "AlicatMFCRemastered.dll"

# Serial connection specifics (Parsed only if connection_type is "Serial")
serial_settings:
  requires_unit_id: true
  unit_id_regex: "^[A-Z]$"
  unit_id_validation_hint: "Alicat Unit IDs must be a single letter (A-Z)."
  variable_baud_rate: true
  allowed_baud_rates: [9600, 19200, 38400, 57600, 115200]
  default_baud_rate: 19200 # Keeps the UI friendly by pre-filling

# Settings required when adding the device through the ARES UI
settings:
  - key: "HasValve"
    display_name: "Has Integrated Valve"
    type: "boolean"
    description: "Specify true if this unit is a Controller (MFC), false if it is a Meter (MFM)."

  - key: "IsBasis"
    display_name: "Is Basis Series"
    type: "boolean"
    description: "Set to true if using Alicat Basis/Basis 2 hardware."