syntax = "proto3";

package ares.messages.device_states.chiller;

import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";

message ChillerState {
	string unique_id = 1; // the unique id for this state
	google.protobuf.DoubleValue manifold_temperature = 2; // Temperature (C)
	google.protobuf.Timestamp timestamp = 3;
	string device_id = 4;
}