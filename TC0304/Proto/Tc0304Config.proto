syntax = "proto3";

package tc0304.config;

import "google/protobuf/wrappers.proto";

message Tc0304Config {
  string name = 1;
  string port_name = 2;
  bool simulated = 3;
  google.protobuf.StringValue probe1_name = 4;
  google.protobuf.StringValue probe2_name = 5;
  google.protobuf.StringValue probe3_name = 6;
  google.protobuf.StringValue probe4_name = 7;
}