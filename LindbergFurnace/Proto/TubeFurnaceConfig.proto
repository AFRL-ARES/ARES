syntax = "proto3";

package tube_furnace.config;

message TubeFurnaceConfig {
  string name = 1; // name of the furnace controller
  string port_name = 2; // the port name for the furnace controller to connect to
  bool simulated = 3; // whether or not this furnace controller is simulated or not
  int32 address = 4; // address of this furnace in its serial connection
}