# ARES Device Driver Manifest
# Target: Herkulex DRS Servo

# Basic Metadata
device_type_name: "Herkulex DRS Servo"
driver_id: "herkulex_drs_v1"
connection_type: "Serial"

# The DLL that contains the Servo and ViewModel classes
assembly_name: "HerkulexDRS.dll"

# Serial connection specifics
serial_settings:
  requires_unit_id: false
  variable_baud_rate: true
  allowed_baud_rates: [9600, 19200, 38400, 57600, 115200]
  default_baud_rate: 115200

# Settings required when adding the device through the ARES UI
settings:
  - key: "ServoId"
    display_name: "Servo ID"
    type: "number"
    description: "The ID of the servo (default is 1)."