syntax = "proto3";

package FlirCM3.config;

message FlirCM3Config {
	string name = 1;
	string id = 2;
	bool simulated = 3;
	double exposure_compensation = 4;
	double exposure_time = 5;
	double gain = 6;
	double gamma = 7;
	double black_level = 8;
	double red_balance = 9;
	double blue_balance = 10;
	int64 capture_width = 11;
	int64 capture_height = 12;
	int64 offset_x = 13;
	int64 offset_y = 14;
}