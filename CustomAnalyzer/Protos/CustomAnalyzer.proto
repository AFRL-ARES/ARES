syntax = "proto3";

package CustomAnalyzer;

service Analyzer {
  rpc Analyze (AnalysisRequest) returns (AnalysisResponse) {}
}

message AnalysisRequest {
  repeated int32 raman_values = 1;
  repeated double raman_shift = 2;
  double wavelength = 3;
  string results_path = 4;
  string image_path = 5;
  string ref_image_path = 6;
  string experiment_uuid = 7;
}

message AnalysisResponse {
  double value = 1;
}